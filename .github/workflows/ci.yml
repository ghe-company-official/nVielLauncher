name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore nVielLauncher.sln

      - name: Build
        run: dotnet build nVielLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/nVielLauncher.Tests/nVielLauncher.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/nVielLauncher.Tests/TestResults/**
          if-no-files-found: ignore
